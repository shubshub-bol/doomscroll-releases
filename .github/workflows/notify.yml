name: Notify phones of a new version

# When a release is published here, send one Firebase Cloud Messaging push to the topic
# "updates". Every Doomscroll install is subscribed; the app then checks this repo's latest
# release and shows "Doomscroll x.y is available". Can also be run by hand (Actions tab).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Get a Firebase access token from the service account
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.messaging

      - name: Send the push to topic "updates"
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          VERSION: ${{ github.event.release.tag_name || 'manual' }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://fcm.googleapis.com/v1/projects/doomscroll-fd192/messages:send" \
            -d "{\"message\":{\"topic\":\"updates\",\"data\":{\"type\":\"update\",\"version\":\"$VERSION\"},\"android\":{\"priority\":\"high\"}}}"
