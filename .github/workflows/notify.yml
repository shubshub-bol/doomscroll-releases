name: Notify phones of a new version

# When a release is published here, send one Firebase Cloud Messaging push to the topic
# "updates". Every Doomscroll install is subscribed; the app then checks this repo's latest
# release and shows "Doomscroll x.y is available". Can also be run by hand (Actions tab).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Send the push to topic "updates"
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VERSION: ${{ github.event.release.tag_name || 'manual' }}
        run: |
          pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, os
          import google.auth.transport.requests as tr
          from google.oauth2 import service_account
          info = json.loads(os.environ["SERVICE_ACCOUNT"])
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/firebase.messaging"])
          session = tr.AuthorizedSession(creds)
          body = {"message": {"topic": "updates",
                              "data": {"type": "update", "version": os.environ["VERSION"]},
                              "android": {"priority": "high"}}}
          r = session.post(f"https://fcm.googleapis.com/v1/projects/{info['project_id']}/messages:send", json=body)
          print(r.status_code, r.text)
          r.raise_for_status()
          PY
